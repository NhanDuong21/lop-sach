map $http_x_request_id $lop_sach_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream lop_sach_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.invalid;

    ssl_certificate /etc/letsencrypt/live/api.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.invalid/privkey.pem;

    client_max_body_size 256k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;

    location = /health/live {
        proxy_pass http://lop_sach_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $lop_sach_request_id;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    location = /health/ready {
        proxy_pass http://lop_sach_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $lop_sach_request_id;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }

    location ~ ^/api/v1/backup/(validate|restore)$ {
        client_max_body_size 2m;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass http://lop_sach_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $lop_sach_request_id;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
    }

    location /api/v1/ {
        proxy_pass http://lop_sach_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $lop_sach_request_id;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
